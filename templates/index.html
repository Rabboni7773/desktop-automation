<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Chat</title>
    
    <!-- Tailwind CSS (with Typography plugin for Markdown styling) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Marked.js (For parsing Markdown to HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#131314] text-[#e3e3e3] h-screen flex font-sans antialiased overflow-hidden">

    <!-- Collapsible Sidebar (Now matches the body background) -->
    <aside id="sidebar" class="w-64 transition-all duration-300 ease-in-out shrink-0 overflow-hidden bg-[#131314] border-r border-gray-800/40 flex flex-col justify-between p-3">
        <div>
            <!-- New Chat Button -->
            <button id="new-chat-btn" title="New Chat" class="flex items-center gap-3 w-full p-3 bg-[#1e1f20] hover:bg-[#282a2c] border border-gray-700/50 rounded-full text-sm font-medium transition mb-6">
                <!-- Plus Icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300 shrink-0"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <!-- Text Label -->
                <span class="sidebar-text truncate">New chat</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-screen relative min-w-0">
        
        <!-- Header -->
        <header class="flex items-center gap-4 p-4 border-b border-gray-800/40">
            <!-- Dynamic Sidebar Toggle Button -->
            <button id="toggle-sidebar" class="p-2 hover:bg-[#282a2c] rounded-full text-gray-400 hover:text-white transition">
                <span id="toggle-icon"></span>
            </button>
            <h1 class="text-xl font-semibold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                Automate
            </h1>
        </header>

        <!-- Chat Messages Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-6 max-w-4xl mx-auto w-full">
            <!-- Initial greeting -->
            <div id="initial-greeting" class="text-center text-gray-500 mt-20 flex flex-col items-center">
                <h2 class="text-2xl font-medium text-gray-200 mb-2">Where shall we begin?</h2>
                <p>Connect to your FastAPI backend.</p>
            </div>
        </main>

        <!-- Input Area -->
        <div class="p-4 max-w-4xl mx-auto w-full">
            <!-- Input box kept slightly lighter to pop off the seamless background -->
            <div class="relative bg-[#1e1f20] border border-gray-700/60 rounded-3xl p-2 focus-within:border-gray-500 transition shadow-lg flex items-end">
                <textarea 
                    id="message-input" 
                    rows="1" 
                    placeholder="Ask your agent..." 
                    class="w-full bg-transparent text-white placeholder-gray-500 resize-none outline-none px-4 py-2 max-h-48"
                ></textarea>
                <button 
                    id="send-button" 
                    class="mb-1 mr-1 p-2 bg-white text-black hover:bg-gray-200 rounded-full transition font-medium"
                >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputField = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const toggleIcon = document.getElementById('toggle-icon');
        const newChatBtn = document.getElementById('new-chat-btn');
        const sidebarTexts = document.querySelectorAll('.sidebar-text');

        let threadId = crypto.randomUUID();
        let isSidebarOpen = true;

        const hamburgerIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
        const closeIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

        toggleIcon.innerHTML = closeIcon;

        toggleSidebarBtn.addEventListener('click', () => {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-64');
                sidebarTexts.forEach(el => el.classList.remove('hidden'));
                toggleIcon.innerHTML = closeIcon;
            } else {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-16');
                sidebarTexts.forEach(el => el.classList.add('hidden'));
                toggleIcon.innerHTML = hamburgerIcon;
            }
        });

        newChatBtn.addEventListener('click', () => {
            threadId = crypto.randomUUID();
            chatContainer.innerHTML = `
                <div id="initial-greeting" class="text-center text-gray-500 mt-20 flex flex-col items-center">
                    <h2 class="text-2xl font-medium text-gray-200 mb-2">Where shall we begin?</h2>
                    <p>Connect to your FastAPI backend.</p>
                </div>
            `;
            inputField.value = '';
            inputField.style.height = 'auto';
        });

        inputField.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        function appendMessage(text, isUser) {
            const greeting = document.getElementById('initial-greeting');
            if (greeting) greeting.remove();

            const messageWrapper = document.createElement('div');

            if (isUser) {
                messageWrapper.className = 'flex gap-4 w-full mb-8 justify-end';
                messageWrapper.innerHTML = `
                    <div class="max-w-[80%] rounded-2xl p-4 bg-[#282a2c] text-gray-200 text-base leading-relaxed rounded-tr-none whitespace-pre-wrap">${text}</div>
                    <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center shrink-0 mt-1">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                `;
            } else {
                messageWrapper.className = 'flex gap-4 w-full mb-8';
                messageWrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shrink-0 mt-1">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                            <path d="M2 14h2"></path>
                            <path d="M20 14h2"></path>
                            <path d="M15 13v2"></path>
                            <path d="M9 13v2"></path>
                            <path d="M12 8V4H8"></path>
                        </svg>
                    </div>
                    <div class="flex-1 text-gray-200 text-base leading-relaxed pt-1 prose prose-invert max-w-none">${marked.parse(text)}</div>
                `;
            }

            chatContainer.appendChild(messageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            if (!isUser) return messageWrapper.lastElementChild;
        }

        async function handleSend() {
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. Render User Message
            appendMessage(userText, true);
            inputField.value = '';
            inputField.style.height = 'auto';

            // 2. Render Agent Placeholder
            const responseTextContainer = appendMessage("Thinking...", false);

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: userText,
                        thread_id: threadId
                    })
                });

                // 3. Prepare to read the stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";

                // 4. Loop through the incoming chunks
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // Decode the raw bytes into text and add to our full string
                    fullText += decoder.decode(value, { stream: true });
                    
                    // Parse the Markdown in real-time and update the UI
                    responseTextContainer.innerHTML = marked.parse(fullText);
                    
                    // Keep the chat scrolled to the bottom as text generates
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (error) {
                responseTextContainer.innerHTML = marked.parse("Error connecting to backend.");
            }
        }

        sendButton.addEventListener('click', handleSend);
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
