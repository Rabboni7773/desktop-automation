<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automate AI</title>
  <meta name="description" content="A premium AI chat experience" />
  {% if use_tailwind_cdn %}
  <script src="https://cdn.tailwindcss.com"></script>
  {% endif %}
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bg: '#0f172a',
              panel: '#111827',
              card: '#1f2937',
              accent: '#3b82f6',
              accent2: '#10b981',
              text: '#e5e7eb',
              muted: '#94a3b8'
            },
            boxShadow: {
              soft: '0 10px 40px rgba(15, 23, 42, 0.25)'
            }
          }
        }
      };
    }
  </script>
  <style>
    html.dark { color-scheme: dark; }
    html.light { color-scheme: light; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body, #app, aside, main, header, footer { transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
    .glass { backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); background: rgba(255,255,255,0.05); }
    html.light .glass { background: rgba(255,255,255,0.75); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .prose pre { background: #0b1220; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1rem; overflow-x: auto; }
    .prose code { font-size: 0.92em; }
    .typing-dot { animation: bounce 1.4s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.45;} 40% { transform: translateY(-6px); opacity: 1; } }
    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 999px; }

    /* Prose in light mode */
    html.light .prose pre { background: #f1f5f9 !important; border-color: rgba(148,163,184,0.3) !important; color: #1e293b !important; }
    html.light .prose code { color: #1e293b !important; }
    html.light .prose { color: #374151 !important; }
  </style>
</head>
<body class="h-full text-slate-100">
  <div id="app" class="flex h-screen overflow-hidden"></div>
  <script type="module" src="/static/ui.js"></script>
</body>
</html>
